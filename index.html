<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TORRES & CO. | Relojes</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0c0d;color:#f7f3e8;font-family:Arial,sans-serif}header{padding:34px 18px;text-align:center;border-bottom:1px solid #b99a50;background:linear-gradient(130deg,#111,#25211a)}header h1{margin:0;color:#d7b766;letter-spacing:5px;font-size:30px}header p{color:#ccc;margin:12px 0 0}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filters button{background:#181818;color:#e4c36f;border:1px solid #6b572e;padding:9px 13px;border-radius:20px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{border:1px solid #3a3324;background:#151515;border-radius:12px;overflow:hidden}.photo{height:210px;background:radial-gradient(ellipse,#333,#101010);display:flex;align-items:center;justify-content:center;color:#c8a85c;font-size:25px;letter-spacing:4px}.photo img{width:100%;height:100%;object-fit:contain}.info{padding:16px}.cat{color:#c8a85c;text-transform:uppercase;font-size:11px;letter-spacing:2px}h2{font-size:17px;margin:9px 0}.desc{color:#bbb;font-size:13px;line-height:1.5;min-height:38px}.price{color:#e5c36c;font-size:22px;font-weight:bold;margin:14px 0}.source{color:#aaa;font-size:12px}.note{margin:28px 0;color:#aaa;font-size:12px;line-height:1.5}a{color:#e5c36c}@media(max-width:480px){header h1{font-size:24px}}
</style></head><body><header><h1>TORRES & CO.</h1><p>Relojes seleccionados · Estilo que se nota</p></header><main class="wrap"><div class="filters" id="filters"></div><div class="grid" id="grid"></div><p class="note">Los precios publicados se calcularon como precio original × 2 + $20.000. Confirmá disponibilidad, colores y características con el proveedor antes de vender.</p></main><script>
const money=n=>n.toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});let all=[],active='Todos';
fetch('/products.json').then(r=>r.json()).then(ps=>{all=ps;const cats=['Todos',...new Set(ps.map(p=>p.cat))];document.getElementById('filters').innerHTML=cats.map(c=>`<button onclick="filterBy('${c.replaceAll("'","\\'")}')">${c}</button>`).join('');render()});
function filterBy(c){active=c;render()}function render(){let ps=active==='Todos'?all:all.filter(p=>p.cat===active);document.getElementById('grid').innerHTML=ps.map(p=>`<article class="card"><div class="photo">${p.image?`<img src="${p.image}" alt="${p.name}">`:'TORRES & CO.'}</div><div class="info"><div class="cat">${p.cat}</div><h2>${p.name}</h2><p class="desc">${p.desc}</p><div class="price">${money(p.price)}</div><a class="source" href="${p.sourceUrl}" target="_blank" rel="noopener">Ver ficha de referencia</a></div></article>`).join('')}
</script></body></html>
